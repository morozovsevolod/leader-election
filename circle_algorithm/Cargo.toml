[package]
name = "circle_algorithm"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.3"
tonic = "0.14.2"
tonic-prost = "0.14.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-prost-build = "0.14.2"
tonic-build = "0.14.2"
